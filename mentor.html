<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentors — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<div id="nav"></div>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div class="grow">
        <h1 id="title">Mentors</h1>
        <p id="sub">People who can teach you a skill. Request a session, or connect first and say hello.</p>
      </div>
      <div class="head-actions">
        <input class="input search" id="q" type="search" placeholder="Search by name or skill" aria-label="Search mentors">
      </div>
    </div>

    <div class="filter-bar" id="filters"></div>
    <div class="people" id="people"></div>
  </div>
</main>

<script src="sync.js"></script>
<script src="ss.js"></script>
<script src="hub.js"></script>
<script>
  var user = SS.guard(null);
  if (user) {
    SS.renderNav({ active: 'mentors' });

    var skillFilter = new URLSearchParams(location.search).get('skill') || '';

    function setSkill(s) {
      skillFilter = s;
      history.replaceState(null, '', s ? 'mentor.html?skill=' + encodeURIComponent(s) : 'mentor.html');
      render();
    }

    function render() {
      var q = document.getElementById('q').value.trim().toLowerCase();
      var all = SS.teachers().map(function (t) { t.role = 'mentor'; t.key = SS.keyOf('mentor', t.email); return t; });

      document.getElementById('title').textContent = skillFilter ? 'Mentors for ' + skillFilter : 'Mentors';

      document.getElementById('filters').innerHTML =
        '<button class="' + (!skillFilter ? 'on' : '') + '" data-f="">All skills</button>' +
        SS.SKILLS.map(function (s) {
          return '<button class="' + (skillFilter === s.name ? 'on' : '') + '" data-f="' + SS.esc(s.name) + '">' + SS.esc(s.name) + '</button>';
        }).join('');

      var list = all.filter(function (t) {
        if (skillFilter && t.skill !== skillFilter) return false;
        if (q && (t.name + ' ' + t.skill + ' ' + (t.bio || '')).toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort(function (a, b) { return (b.sessionsAccepted || 0) - (a.sessionsAccepted || 0); });

      document.getElementById('people').innerHTML = list.length ? list.map(function (t) {
        var st = SS.connState(user.key, t.key).state;
        var connectBtn =
          st === 'connected' ? '<a class="btn btn-ghost btn-sm" href="network.html?tab=connections">Connected</a>' :
          st === 'sent' ? '<button class="btn btn-ghost btn-sm" disabled>Request sent</button>' :
          st === 'incoming' ? '<a class="btn btn-ghost btn-sm" href="network.html?tab=requests">Respond</a>' :
          '<button class="btn btn-ghost btn-sm" data-connect="' + SS.esc(t.key) + '">Connect</button>';
        return SS.personCard(t, '<button class="btn btn-learner btn-sm" data-req="' + SS.esc(t.email) + '">Request session</button>' + connectBtn);
      }).join('') : '<div class="empty" style="grid-column:1/-1"><h3>No mentors here yet</h3><p>' +
          (skillFilter ? 'Nobody teaches ' + SS.esc(skillFilter) + ' yet. You can still post an open request and the first mentor to join will see it.' : 'No mentors match your search.') +
          '</p>' + (skillFilter ? '<button class="btn btn-learner" data-post="1">Post an open request</button>' : '') + '</div>';
    }

    document.getElementById('q').addEventListener('input', render);
    document.addEventListener('click', function (e) {
      var f = e.target.closest('[data-f]');
      if (f) return setSkill(f.dataset.f);
      var r = e.target.closest('[data-req]');
      if (r) { var m = SS.findUser('mentor', r.dataset.req); return SS.openRequestModal({ skill: m.skill, mentor: m }); }
      var c = e.target.closest('[data-connect]');
      if (c) { if (SS.sendConnect(user.key, c.dataset.connect)) SS.toast('Connection request sent.'); return render(); }
      if (e.target.closest('[data-post]')) SS.openRequestModal({ skill: skillFilter });
    });

    SS.startTick(render);
    render();
  }
</script>
</body>
</html>
