<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<div id="nav"></div>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div class="grow">
        <h1>Network</h1>
        <p id="sub"></p>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panel"></div>
  </div>
</main>

<script src="sync.js"></script>
<script src="ss.js"></script>
<script src="hub.js"></script>
<script>
  var user = SS.guard(null);
  if (user) {
    SS.renderNav({ active: 'network' });

    var isMentor = user.role === 'mentor';
    document.getElementById('sub').textContent = isMentor
      ? 'Connect with other mentors. Swap teaching tips, and learn a new skill from each other.'
      : 'Connect with mentors and fellow learners. Once connected, you can message each other.';

    var params = new URLSearchParams(location.search);
    var tab = ['discover', 'requests', 'connections'].indexOf(params.get('tab')) > -1 ? params.get('tab') : 'discover';
    var pool = 'mentor';          // learners can switch to 'learner'
    var q = '';
    var activeConn = params.get('chat') || null;
    var threadOpen = !!activeConn;
    if (activeConn) tab = 'connections';

    function who(k) { return SS.userByKey(k); }

    /* ---------- tabs ---------- */
    function renderTabs() {
      var inc = SS.incomingConns(user.key).length;
      var con = SS.myConns(user.key).length;
      var items = [['discover', 'Discover', 0], ['requests', 'Requests', inc], ['connections', 'Connections (' + con + ')', 0]];
      document.getElementById('tabs').innerHTML = items.map(function (t) {
        return '<button role="tab" class="' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] +
          (t[2] ? '<span class="nav-dot">' + t[2] + '</span>' : '') + '</button>';
      }).join('');
    }

    /* ---------- discover ---------- */
    function peopleCards() {
      var rolePool = isMentor ? 'mentor' : pool;
      var raw = rolePool === 'mentor' ? SS.teachers() : SS.learners();
      var list = raw.map(function (x) { x.role = rolePool; x.key = SS.keyOf(rolePool, x.email); return x; })
        .filter(function (x) { return x.key !== user.key; })
        .filter(function (x) {
          if (!q) return true;
          var hay = x.name + ' ' + (x.skill || '') + ' ' + (x.interests || []).join(' ') + ' ' + (x.bio || x.goal || '');
          return hay.toLowerCase().indexOf(q) > -1;
        });

      return list.length ? list.map(function (x) {
        var st = SS.connState(user.key, x.key);
        var act;
        if (st.state === 'connected') act = '<button class="btn btn-primary btn-sm" data-chat="' + st.conn.id + '">Message</button>';
        else if (st.state === 'sent') act = '<button class="btn btn-ghost btn-sm" disabled>Request sent</button>';
        else if (st.state === 'incoming') act = '<button class="btn btn-ok btn-sm" data-acc="' + st.conn.id + '">Accept</button><button class="btn btn-ghost btn-sm" data-dec="' + st.conn.id + '">Decline</button>';
        else act = '<button class="btn ' + (isMentor ? 'btn-mentor' : 'btn-primary') + ' btn-sm" data-connect="' + SS.esc(x.key) + '">Connect</button>';
        if (!isMentor && x.role === 'mentor') act += '<button class="btn btn-ghost btn-sm" data-req="' + SS.esc(x.email) + '">Request session</button>';
        return SS.personCard(x, act);
      }).join('') : '<div class="empty" style="grid-column:1/-1"><h3>Nobody found</h3><p>' +
          (q ? 'Try a different name or skill.' : 'People will appear here as they join SkillSwap.') + '</p></div>';
    }

    function discoverHtml() {
      var toolbar = '<div class="toolbar">' +
        (isMentor ? '' : '<div class="seg"><button class="' + (pool === 'mentor' ? 'on' : '') + '" data-pool="mentor">Mentors</button><button class="' + (pool === 'learner' ? 'on' : '') + '" data-pool="learner">Learners</button></div>') +
        '<input class="input search" id="q" type="search" placeholder="Search by name or skill" value="' + SS.esc(q) + '" aria-label="Search people">' +
        '</div>';

      return toolbar + '<div class="people" id="peopleGrid">' + peopleCards() + '</div>';
    }

    /* ---------- requests ---------- */
    function rowFor(c, mine) {
      var other = who(mine ? c.b : c.a);
      if (!other) return '';
      var actions = mine
        ? '<button class="btn btn-danger btn-sm" data-cancel="' + c.id + '">Cancel</button>'
        : '<button class="btn btn-ok btn-sm" data-acc="' + c.id + '">Accept</button><button class="btn btn-ghost btn-sm" data-dec="' + c.id + '">Decline</button>';
      return '<div class="row-card"><div class="row-top" style="gap:14px">' + SS.avatar(other, 'md') +
        '<div class="info" style="min-width:0"><div class="row-top"><strong style="font-family:var(--font-display);font-size:18px">' + SS.esc(other.name) + '</strong>' +
        (other.sample ? '<span class="tag-sample">Sample</span>' : '') +
        '<span class="role-pill role-' + other.role + '">' + (other.role === 'mentor' ? 'Mentor' : 'Learner') + '</span></div>' +
        '<p>' + (mine ? 'Waiting for them to accept' : 'Wants to connect with you') + (other.skill ? ' · ' + SS.esc(other.skill) : '') + '</p></div></div>' +
        '<div class="actions">' + actions + '</div></div>';
    }

    function requestsHtml() {
      var inc = SS.incomingConns(user.key), out = SS.outgoingConns(user.key);
      var h = '<div class="section-head" style="margin-top:0"><h2>Wants to connect with you</h2></div>' +
        (inc.length ? inc.map(function (c) { return rowFor(c, false); }).join('') :
          '<div class="empty"><h3>No requests right now</h3><p>When someone wants to connect, you can accept or decline here.</p></div>');
      h += '<div class="section-head"><h2>Requests you sent</h2></div>' +
        (out.length ? out.map(function (c) { return rowFor(c, true); }).join('') :
          '<div class="empty"><h3>Nothing pending</h3><p>Find people in Discover and send a request.</p></div>');
      return h;
    }

    /* ---------- connections + chat ---------- */
    function connectionsHtml() {
      var list = SS.myConns(user.key).map(function (c) {
        var o = who(SS.otherKey(c, user.key));
        var t = SS.thread(c.id);
        return { c: c, o: o, last: t.length ? t[t.length - 1] : null };
      }).filter(function (x) { return x.o; })
        .sort(function (a, b) { return Date.parse(b.last ? b.last.date : b.c.date) - Date.parse(a.last ? a.last.date : a.c.date); });

      if (!list.length) {
        return '<div class="empty"><h3>No connections yet</h3><p>' +
          (isMentor ? 'Connect with other mentors to swap tips and start conversations.' : 'Connect with mentors and fellow learners to start chatting.') +
          '</p><button class="btn btn-primary" data-tab="discover">Discover people</button></div>';
      }
      if (!activeConn || !list.some(function (x) { return x.c.id === activeConn; })) activeConn = list[0].c.id;
      var cur = list.filter(function (x) { return x.c.id === activeConn; })[0];

      var side = list.map(function (x) {
        return '<button class="chat-item' + (x.c.id === activeConn ? ' on' : '') + '" data-chat="' + x.c.id + '">' + SS.avatar(x.o, 'md') +
          '<span class="t"><strong>' + SS.esc(x.o.name) + '</strong><small>' + SS.esc(x.last ? x.last.text : 'Say hello') + '</small></span></button>';
      }).join('');

      var msgs = SS.thread(cur.c.id).map(function (m) {
        return '<div class="bubble ' + (m.sender === user.key ? 'mine' : 'theirs') + '" title="' + new Date(m.date).toLocaleString() + '">' + SS.esc(m.text) + '</div>';
      }).join('') || '<div class="chat-empty">You are connected. Say hello to ' + SS.esc(cur.o.name.split(' ')[0]) + '.</div>';

      return '<div class="chat' + (threadOpen ? ' has-thread' : '') + '">' +
        '<div class="chat-list">' + side + '</div>' +
        '<div class="chat-pane">' +
        '<div class="chat-head"><button class="btn btn-ghost btn-sm chat-back" data-back>Back</button>' + SS.avatar(cur.o, 'sm') +
        '<div class="grow"><strong>' + SS.esc(cur.o.name) + '</strong><small>' + (cur.o.role === 'mentor' ? 'Mentor · ' + SS.esc(cur.o.skill) : 'Learner') +
        (cur.o.sample ? ' · Sample profile, replies are automatic' : '') + '</small></div>' +
        '<button class="btn btn-danger btn-sm" data-remove="' + cur.c.id + '">Remove</button></div>' +
        '<div class="chat-msgs" id="msgs">' + msgs + '</div>' +
        '<form class="chat-form" id="chatForm"><input class="input" id="chatText" autocomplete="off" placeholder="Write a message" aria-label="Message"><button class="btn btn-primary" type="submit">Send</button></form>' +
        '</div></div>';
    }

    /* ---------- main render ---------- */
    function render() {
      user = SS.me();
      renderTabs();
      var p = document.getElementById('panel');
      p.innerHTML = tab === 'discover' ? discoverHtml() : tab === 'requests' ? requestsHtml() : connectionsHtml();

      var m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight;

      var f = document.getElementById('chatForm');
      if (f) f.addEventListener('submit', function (e) {
        e.preventDefault();
        var inp = document.getElementById('chatText'), text = inp.value.trim();
        if (!text) return;
        SS.sendMsg(activeConn, user.key, text);
        var c = SS.conns().filter(function (x) { return x.id === activeConn; })[0];
        if (c) SS.scheduleSampleReply(activeConn, SS.otherKey(c, user.key), render);
        render(); document.getElementById('chatText').focus();
      });
    }

    /* ---------- actions ---------- */
    document.addEventListener('input', function (e) {
      if (e.target.id !== 'q') return;
      q = e.target.value.trim().toLowerCase();
      document.getElementById('peopleGrid').innerHTML = peopleCards();
    });

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-tab]');
      if (t) { tab = t.dataset.tab; return render(); }
      var po = e.target.closest('[data-pool]');
      if (po) { pool = po.dataset.pool; q = ''; return render(); }

      var cn = e.target.closest('[data-connect]');
      if (cn) { if (SS.sendConnect(user.key, cn.dataset.connect)) SS.toast('Connection request sent.'); return render(); }
      var ac = e.target.closest('[data-acc]');
      if (ac) {
        var c1 = SS.conns().filter(function (x) { return x.id === ac.dataset.acc; })[0];
        SS.respondConn(ac.dataset.acc, true);
        var o = c1 && who(SS.otherKey(c1, user.key));
        SS.toast('You are now connected' + (o ? ' with ' + o.name : '') + '.');
        return render();
      }
      var dc = e.target.closest('[data-dec]');
      if (dc) { SS.respondConn(dc.dataset.dec, false); SS.toast('Request declined.'); return render(); }
      var cc = e.target.closest('[data-cancel]');
      if (cc) { SS.removeConn(cc.dataset.cancel); SS.toast('Request cancelled.'); return render(); }
      var ch = e.target.closest('[data-chat]');
      if (ch) { activeConn = ch.dataset.chat; threadOpen = true; tab = 'connections'; return render(); }
      if (e.target.closest('[data-back]')) { threadOpen = false; return render(); }
      var rm = e.target.closest('[data-remove]');
      if (rm && confirm('Remove this connection? Your messages with them will no longer be shown.')) {
        SS.removeConn(rm.dataset.remove); activeConn = null; threadOpen = false; SS.toast('Connection removed.'); return render();
      }
      var rq = e.target.closest('[data-req]');
      if (rq) { var m = SS.findUser('mentor', rq.dataset.req); SS.openRequestModal({ skill: m.skill, mentor: m }); }
    });

    SS.startTick(render);
    render();
  }
</script>
</body>
</html>
