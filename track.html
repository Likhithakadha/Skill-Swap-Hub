<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My requests — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<div id="nav"></div>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div class="grow">
        <h1>My requests</h1>
        <p>Every session you have asked for, and where it stands. Meeting links appear once a mentor accepts.</p>
      </div>
      <div class="head-actions"><a class="btn btn-learner" href="mentor.html">New request</a></div>
    </div>

    <div class="filter-bar" id="filters"></div>
    <div id="list"></div>
  </div>
</main>

<script src="sync.js"></script>
<script src="ss.js"></script>
<script src="hub.js"></script>
<script>
  var user = SS.guard('learner');
  if (user) {
    SS.renderNav({ active: 'requests' });

    var filter = 'all';
    var LABEL = { pending: 'Waiting', accepted: 'Confirmed', declined: 'Declined', cancelled: 'Cancelled' };

    function render() {
      var mine = SS.requestsOfLearner(user.email);
      var counts = { all: mine.length };
      ['pending', 'accepted', 'declined', 'cancelled'].forEach(function (s) {
        counts[s] = mine.filter(function (r) { return r.status === s; }).length;
      });

      document.getElementById('filters').innerHTML = [['all', 'All'], ['pending', 'Waiting'], ['accepted', 'Confirmed'], ['declined', 'Declined'], ['cancelled', 'Cancelled']]
        .map(function (f) { return '<button class="' + (filter === f[0] ? 'on' : '') + '" data-f="' + f[0] + '">' + f[1] + ' (' + counts[f[0]] + ')</button>'; }).join('');

      var list = filter === 'all' ? mine : mine.filter(function (r) { return r.status === filter; });

      document.getElementById('list').innerHTML = list.length ? list.map(function (r) {
        var who = r.mentorEmail ? 'Asked ' + SS.esc(r.mentorName || 'a mentor') : 'Open request to all ' + SS.esc(r.skill) + ' mentors';
        var meet = r.status === 'accepted' && r.meetLink
          ? '<div class="link-line">Accepted by ' + SS.esc(r.mentorName || 'a mentor') + '. Meeting link: <a href="' + SS.esc(r.meetLink) + '" target="_blank" rel="noopener">' + SS.esc(r.meetLink) + '</a></div>' : '';
        var actions = r.status === 'pending' ? '<button class="btn btn-danger btn-sm" data-cancel="' + r.id + '">Cancel request</button>'
          : r.status === 'accepted' ? '<a class="btn btn-learner btn-sm" href="' + SS.esc(r.meetLink) + '" target="_blank" rel="noopener">Join meeting</a>' : '';
        return '<div class="row-card"><div class="info">' +
          '<div class="row-top"><span class="skill-tag">' + SS.skillIcon(r.skill) + SS.esc(r.skill) + '</span><span class="status status-' + r.status + '">' + LABEL[r.status] + '</span></div>' +
          '<h3>' + who + '</h3>' +
          (r.message ? '<p>“' + SS.esc(r.message) + '”</p>' : '') + meet +
          '<div class="meta">Sent ' + new Date(r.date).toLocaleString() + '</div></div>' +
          '<div class="actions">' + actions + '</div></div>';
      }).join('') : '<div class="empty"><h3>' + (mine.length ? 'Nothing in this list' : 'You haven\'t asked for a session yet') + '</h3><p>' +
          (mine.length ? 'Try another filter above.' : 'Pick a mentor and send your first request.') + '</p>' +
          (mine.length ? '' : '<a class="btn btn-learner" href="mentor.html">Find a mentor</a>') + '</div>';
    }

    document.addEventListener('click', function (e) {
      var f = e.target.closest('[data-f]');
      if (f) { filter = f.dataset.f; return render(); }
      var c = e.target.closest('[data-cancel]');
      if (c) { SS.cancelRequest(c.dataset.cancel); SS.toast('Request cancelled.'); render(); }
    });

    SS.startTick(render);
    render();
  }
</script>
</body>
</html>
