<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Swap Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div id="nav"></div>
<main class="page"><div class="wrap" id="view"></div></main>
<script src="sync.js"></script>
<script src="ss.js"></script>
<script src="hub.js"></script>
<script>
var user = SS.guard(null), H = SS.hub, esc = SS.esc;
if (user) {
  var tab = '', edit = false, rating = 0, noteFilter = '', helpOpen = -1;
  function rd(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }
  function wr(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  function head(title, sub, actions) {
    return '<div class="page-head"><div class="grow"><h1>' + title + '</h1><p>' + sub + '</p></div>' + (actions ? '<div class="head-actions">' + actions + '</div>' : '') + '</div>';
  }
  function opts(list, cur) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
  var isM = user.role === 'mentor';

  /* ---------------- Profile ---------------- */
  function vProfile() {
    var F = [['name', 'Full name'], ['phone', 'Phone number'], ['email', 'Email'], ['institute', 'Institute name'], ['qualification', 'Qualification'], ['education', 'Course / branch / year'],
             ['about', 'About you', 1], ['goal', 'Your goal', 1], ['skillsKnown', 'Skills you know (comma separated)']];
    if (isM) F.push(['zoom', 'Your Zoom meeting link', 0, 'Used when you accept a learner request.']);
    var val = function (k) { return k === 'about' ? (user.about || user.bio || '') : (user[k] || ''); };
    var acts = edit ? '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-save>Save</button>' : '<button class="btn btn-primary" data-edit>Edit profile</button>';
    var badge = isM ? SS.computeBadge(user.sessionsAccepted || 0) : null;
    var hero = '<div class="profile-hero ' + (isM ? 'role-mentor' : 'role-learner') + '">' +
      '<div class="profile-hero-avatar">' + SS.avatar(user, 'lg') + '</div>' +
      '<div class="profile-hero-info"><h2>' + esc(user.name) + '</h2>' +
      '<span class="role-pill role-' + user.role + '">' + (isM ? 'Teacher' : 'Learner') + '</span>' +
      (badge ? '<span class="badge-pill">' + badge + '</span>' : '') +
      (isM ? '<p>' + esc(user.skill || '') + '</p>' : '') +
      '<p class="muted">' + esc(user.email) + '</p></div></div>';
    return head('Profile', (isM ? 'Teacher' : 'Learner') + ' account. Your details are saved under your email.', acts) + hero +
      '<div class="card-box photo-row">' + SS.avatar(user, 'md') + '<div><strong>Profile photo</strong><p class="hint">Pick a JPG or PNG from your device.</p><label class="btn btn-ghost btn-sm" for="pfPhoto" style="cursor:pointer">Upload photo</label><input type="file" id="pfPhoto" accept="image/*" hidden></div></div>' +
      '<div class="card-box form-grid">' + F.map(function (f) {
        var v = val(f[0]), body;
        if (!edit || f[0] === 'email') body = '<div class="val">' + (esc(v) || '<span class="muted">Not added yet</span>') + '</div>';
        else if (f[0] === 'institute') body = '<input class="input" id="pf_institute" list="collegeList" autocomplete="off" placeholder="Start typing your college name" value="' + esc(v) + '"><datalist id="collegeList">' + H.COLLEGES.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>';
        else if (f[0] === 'qualification') body = '<select class="input" id="pf_qualification"><option value="">Select qualification</option>' + H.QUALS.concat(v && H.QUALS.indexOf(v) < 0 ? [v] : []).map(function (q) { return '<option' + (q === v ? ' selected' : '') + '>' + esc(q) + '</option>'; }).join('') + '</select>';
        else body = f[2] ? '<textarea class="input" id="pf_' + f[0] + '" rows="3">' + esc(v) + '</textarea>' : '<input class="input" id="pf_' + f[0] + '" value="' + esc(v) + '">';
        return '<div class="field' + (f[2] ? ' span' : '') + '"><label>' + f[1] + '</label>' + body + (edit && f[3] ? '<p class="hint">' + f[3] + '</p>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="card-box danger-zone"><strong>Delete account</strong><p class="hint">This permanently removes your profile, requests, connections, messages, notes and feedback. This cannot be undone.</p>' +
      '<button type="button" class="btn btn-danger" data-delacc>Delete my account</button></div>';
  }

  /* ---------- delete account ---------- */
  function openDeleteModal() {
    var old = document.getElementById('ssModal'); if (old) old.remove();
    var ov = document.createElement('div'); ov.id = 'ssModal'; ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"><h3>Delete your account?</h3>' +
      '<p class="modal-sub" style="color:var(--danger)">This cannot be undone.</p>' +
      '<p>Your profile, requests, connections, messages, notes and feedback will all be permanently removed.</p>' +
      '<label for="delConfirm">Type DELETE to confirm</label><input class="input" id="delConfirm" autocomplete="off">' +
      '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-danger" data-confirm-del>Delete my account</button></div></div>';
    document.body.appendChild(ov);
    function close() { ov.remove(); }
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    ov.querySelector('[data-close]').onclick = close;
    ov.querySelector('[data-confirm-del]').onclick = function () {
      if (document.getElementById('delConfirm').value.trim().toUpperCase() !== 'DELETE') { SS.toast('Type DELETE to confirm.'); return; }
      SS.deleteAccount(user.role, user.email);
      close();
      location.href = 'index.html';
    };
    document.getElementById('delConfirm').focus();
  }

  /* ---------------- Feedback ---------------- */
  var QS = [['clear', 'Was the teacher clear and easy to follow?', ['Yes', 'Mostly', 'No']],
            ['time', 'Did the session start on time?', ['On time', 'A little late', 'Did not happen']],
            ['pace', 'Was the pace right for you?', ['Too fast', 'Just right', 'Too slow']],
            ['again', 'Would you learn from this teacher again?', ['Yes', 'Maybe', 'No']]];
  function stars(n) { return [1, 2, 3, 4, 5].map(function (i) { return '<span class="' + (i <= n ? 'on' : '') + '">★</span>'; }).join(''); }
  function vFeedback() {
    var all = rd('ssh_feedback'), h = '';
    if (!isM) {
      var ts = SS.teachers();
      h += head('Feedback', 'Rate a teacher and tell us how the session went.') +
        '<div class="card-box"><div class="field"><label for="fbMentor">Teacher and skill</label><select class="input" id="fbMentor"><option value="">Select a teacher</option>' +
        ts.map(function (m) { return '<option value="' + esc(m.email) + '">' + esc(m.name) + ' · ' + esc(m.skill) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><span class="label">Your rating</span><div class="stars" id="stars">' + [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" data-star="' + i + '" aria-label="' + i + ' stars">★</button>'; }).join('') + '</div></div>' +
        QS.map(function (q) {
          return '<div class="field"><span class="label">' + q[1] + '</span><div class="opt-row">' + q[2].map(function (o) { return '<label class="pick"><input type="radio" name="q_' + q[0] + '" value="' + o + '"><span>' + o + '</span></label>'; }).join('') + '</div></div>';
        }).join('') +
        '<div class="field"><label for="fbText">Anything else? (optional)</label><textarea class="input" id="fbText" rows="3" placeholder="What went well? What could be better?"></textarea></div>' +
        '<button class="btn btn-learner" data-fb>Submit feedback</button></div>';
      var mine = all.filter(function (f) { return f.from === user.email; });
      h += '<div class="section-head"><h2>Your feedback</h2></div>' + (mine.length ? mine.reverse().map(fbCard).join('') : '<div class="empty"><h3>No feedback yet</h3><p>Your ratings will be listed here.</p></div>');
    } else {
      var got = all.filter(function (f) { return f.mentor === user.email; });
      var avg = got.length ? (got.reduce(function (s, f) { return s + f.rating; }, 0) / got.length).toFixed(1) : null;
      h += head('Feedback', avg ? 'Your average rating is ' + avg + ' out of 5 from ' + got.length + ' review' + (got.length === 1 ? '' : 's') + '.' : 'Ratings from learners will show up here.') +
        (got.length ? got.reverse().map(fbCard).join('') : '<div class="empty"><h3>No feedback yet</h3><p>After sessions, learners can rate you here.</p></div>');
    }
    return h;
  }
  function fbCard(f) {
    var m = SS.findUser('mentor', f.mentor);
    return '<div class="row-card"><div class="info"><div class="row-top"><span class="skill-tag">' + SS.skillIcon(f.skill) + esc(f.skill) + '</span><span class="stars-ro">' + stars(f.rating) + '</span></div>' +
      '<h3>' + (isM ? esc(f.fromName) : esc(m ? m.name : 'Teacher')) + '</h3><p>' + QS.map(function (q) { return f.answers[q[0]] ? esc(q[1]) + ' <b>' + esc(f.answers[q[0]]) + '</b>' : ''; }).filter(Boolean).join('<br>') + '</p>' +
      (f.comment ? '<p>“' + esc(f.comment) + '”</p>' : '') + '<div class="meta">' + new Date(f.date).toLocaleDateString() + '</div></div></div>';
  }

  /* ---------------- Notes ---------------- */
  function vNotes() {
    var all = rd('ssh_notes').filter(function (n) { return n.owner === user.key; });
    var list = noteFilter ? all.filter(function (n) { return n.skill === noteFilter; }) : all;
    var def = noteFilter || (user.interests || [])[0] || (isM ? user.skill : '') || SS.SKILLS[0].name;
    return head('Notes', 'Save key points skill by skill. Notes are kept in your account.') +
      '<div class="card-box"><div class="field"><label for="ntSkill">Skill</label><select class="input" id="ntSkill">' + opts(SS.SKILLS.map(function (s) { return [s.name, s.name]; }), def) + '</select></div>' +
      '<div class="field"><label for="ntText">Key points</label><textarea class="input" id="ntText" rows="4" placeholder="What did you learn today?"></textarea></div><button class="btn btn-primary" data-note>Save note</button></div>' +
      '<div class="filter-bar"><button class="' + (!noteFilter ? 'on' : '') + '" data-nf="">All skills (' + all.length + ')</button>' +
      SS.SKILLS.filter(function (s) { return all.some(function (n) { return n.skill === s.name; }); }).map(function (s) { return '<button class="' + (noteFilter === s.name ? 'on' : '') + '" data-nf="' + esc(s.name) + '">' + esc(s.name) + '</button>'; }).join('') + '</div>' +
      (list.length ? list.slice().reverse().map(function (n) {
        return '<div class="row-card"><div class="info"><div class="row-top"><span class="skill-tag">' + SS.skillIcon(n.skill) + esc(n.skill) + '</span></div><p class="note-text">' + esc(n.text) + '</p><div class="meta">' + new Date(n.date).toLocaleString() + '</div></div><div class="actions"><button class="btn btn-danger btn-sm" data-delnote="' + n.id + '">Delete</button></div></div>';
      }).join('') : '<div class="empty"><h3>No notes here yet</h3><p>Write your first key points above.</p></div>');
  }

  /* ---------------- Help ---------------- */
  var FAQ = [
    ['How do I sign up as a learner or a teacher?', 'On the welcome page tap "I want to learn" or "I want to teach". Fill in your name, email and password, pick your skills, and your account is created. Want both? Sign up twice with the same email.'],
    ['How do I request a session?', 'Open Find Mentor or Skills Explore, choose a teacher and tap "Request session". Add a short message and send.'],
    ['How does the teacher get my request?', 'The request appears on the teacher\'s Home page inside the website, and an email with your request is sent to the teacher\'s email address.'],
    ['How do I get the Zoom link?', 'When the teacher accepts, they add their Zoom meeting link. It then shows under Upcoming sessions on your Home page with a "Join meeting" button.'],
    ['How do I chat with a teacher or learner?', 'Open Connections from Home. You can message anyone you are connected with. Teachers and learners are connected automatically once a request is accepted.'],
    ['How do I edit my profile?', 'Go to Profile, tap "Edit profile", change your details and tap Save.'],
    ['Where are my notes saved?', 'Notes are saved in your account, skill by skill. Open Notes and use the skill buttons to filter them.'],
    ['How do I rate a teacher?', 'Open Feedback, choose the teacher, give 1 to 5 stars, answer the four short questions and submit.'],
    ['I forgot my password. What now?', 'Password reset is not available in this version. Sign up again with a different email, or ask the site owner to clear your old account.'],
    ['How do I change language, dark mode or font size?', 'Open Settings. Language, theme, font size, background colour, and who can send you connection requests can all be changed there and are saved to your account.']
  ];
  function vHelp() {
    return head('Help', 'Choose a question to see the answer.') + FAQ.map(function (f, i) {
      return '<div class="faq' + (helpOpen === i ? ' open' : '') + '"><button data-faq="' + i + '"><span>' + (i + 1) + '. ' + esc(f[0]) + '</span><b>' + (helpOpen === i ? '−' : '+') + '</b></button>' + (helpOpen === i ? '<p>' + esc(f[1]) + '</p>' : '') + '</div>';
    }).join('');
  }

  /* ---------------- Settings ---------------- */
  function vSettings() {
    var p = H.prefs();
    var row = function (label, hint, ctl) { return '<div class="set-row"><div><strong>' + label + '</strong><p class="hint">' + hint + '</p></div><div>' + ctl + '</div></div>'; };
    var sel = function (k, list) { return '<select class="input" data-pref="' + k + '"' + (k === 'lang' ? ' translate="no"' : '') + '>' + opts(list, String(p[k])) + '</select>'; };
    return head('Settings', 'Changes are saved to your account straight away.') + '<div class="card-box">' +
      row('Language', 'The whole site changes to the language you pick.', sel('lang', H.LANGS)) +
      row('Theme', 'Light, dark, or follow your device.', sel('theme', [['light', 'Light'], ['dark', 'Dark'], ['auto', 'Match device']])) +
      row('Font size', 'Make text smaller or larger.', sel('font', [['s', 'Small'], ['m', 'Medium'], ['l', 'Large']])) +
      row('Background', 'Colour behind the pages (light theme).', '<div class="swatches">' + Object.keys(H.BGS).map(function (k) {
        return '<button type="button" class="swatch' + (p.bg === k ? ' on' : '') + '" data-bg="' + k + '" style="background:' + (H.BGS[k] || H.AURORA) + '" aria-label="' + k + '"></button>'; }).join('') + '</div>') +
      row('Network access', 'Who can send you connection requests.', sel('connect', isM ? [['everyone', 'Everyone'], ['nobody', 'Nobody']] : [['requested', 'Only teachers I sent a request to'], ['nobody', 'Nobody'], ['everyone', 'Everyone']])) +
      row('Email alerts', 'Get an email when a learner sends you a request.', sel('emailNotify', [['true', 'On'], ['false', 'Off']])) +
      row('Desktop notifications', (isM ? 'Get a pop-up on this device the moment a learner sends you a request.' : 'Get a pop-up on this device the moment a teacher accepts your request.') + ' Keep a tab open to receive them.', sel('desktopNotify', [['true', 'On'], ['false', 'Off']])) + '</div>';
  }

  /* ---------------- router ---------------- */
  var VIEWS = { profile: vProfile, feedback: vFeedback, notes: vNotes, help: vHelp, settings: vSettings };
  function render() { document.getElementById('view').innerHTML = VIEWS[tab](); }
  function route() {
    tab = (location.hash || '#profile').slice(1); if (!VIEWS[tab]) tab = 'profile';
    edit = false; user = SS.me(); SS.renderNav({ active: tab }); render();
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('click', function (e) {
    var b, c = function (s) { return (b = e.target.closest(s)); };
    if (c('[data-edit]')) { edit = true; return render(); }
    if (c('[data-cancel]')) { edit = false; return render(); }
    if (c('[data-save]')) {
      var v = {};
      ['name', 'phone', 'institute', 'qualification', 'education', 'about', 'goal', 'skillsKnown', 'zoom'].forEach(function (k) { var el = document.getElementById('pf_' + k); if (el) v[k] = el.value.trim(); });
      if (!v.name) return SS.toast('Please enter your name.');
      if (v.phone && !SS.validPhone(v.phone)) return SS.toast('Enter a valid 10-digit mobile number.');
      if (v.zoom && !/^https?:\/\//i.test(v.zoom)) v.zoom = 'https://' + v.zoom.replace(/^\/+/, '');
      if (v.zoom && !/^https?:\/\/[^\s]+\.[^\s]+/i.test(v.zoom)) return SS.toast('Enter a valid meeting link, for example https://zoom.us/j/123456789');
      SS.updateUser(user.role, user.email, function (x) { for (var k in v) x[k] = v[k]; if (isM) x.bio = v.about; });
      edit = false; user = SS.me(); SS.renderNav({ active: tab }); SS.toast('Profile saved.'); return render();
    }
    if (c('[data-star]')) { rating = +b.dataset.star; document.querySelectorAll('#stars button').forEach(function (s) { s.classList.toggle('on', +s.dataset.star <= rating); }); return; }
    if (c('[data-fb]')) {
      var m = document.getElementById('fbMentor').value;
      if (!m) return SS.toast('Choose a teacher first.');
      if (!rating) return SS.toast('Tap the stars to give a rating.');
      var ans = {}; QS.forEach(function (q) { var r = document.querySelector('input[name="q_' + q[0] + '"]:checked'); if (r) ans[q[0]] = r.value; });
      var l = rd('ssh_feedback'), tm = SS.findUser('mentor', m);
      l.push({ id: 'fb_' + Date.now(), from: user.email, fromName: user.name, mentor: m, skill: tm ? tm.skill : '', rating: rating, answers: ans, comment: document.getElementById('fbText').value.trim(), date: new Date().toISOString() });
      wr('ssh_feedback', l); rating = 0; SS.toast('Thanks for your feedback.'); return render();
    }
    if (c('[data-note]')) {
      var txt = document.getElementById('ntText').value.trim();
      if (!txt) return SS.toast('Write something first.');
      var nl = rd('ssh_notes'); nl.push({ id: 'n_' + Date.now(), owner: user.key, skill: document.getElementById('ntSkill').value, text: txt, date: new Date().toISOString() });
      wr('ssh_notes', nl); SS.toast('Note saved.'); return render();
    }
    if (c('[data-nf]')) { noteFilter = b.dataset.nf; return render(); }
    if (c('[data-delnote]')) { wr('ssh_notes', rd('ssh_notes').filter(function (n) { return n.id !== b.dataset.delnote; })); return render(); }
    if (c('[data-faq]')) { var i = +b.dataset.faq; helpOpen = helpOpen === i ? -1 : i; return render(); }
    if (c('[data-bg]')) { var p = H.prefs(); p.bg = b.dataset.bg; H.savePrefs(p); return render(); }
    if (c('[data-delacc]')) { return openDeleteModal(); }
  });
  document.addEventListener('change', function (e) {
    var s = e.target.closest('[data-pref]'); if (!s) return;
    var p = H.prefs(), v = s.value;
    if (s.dataset.pref === 'desktopNotify' && v === 'true') {
      if (typeof Notification === 'undefined') { SS.toast('This browser does not support desktop notifications.'); s.value = 'false'; return; }
      if (Notification.permission === 'denied') { SS.toast('Notifications are blocked for this site. Allow them in your browser settings first.'); s.value = 'false'; return; }
      if (Notification.permission !== 'granted') {
        Notification.requestPermission().then(function (perm) {
          if (perm !== 'granted') { SS.toast('Allow notifications in the browser prompt to turn this on.'); return render(); }
          p.desktopNotify = true; H.savePrefs(p); SS.toast('Desktop notifications are on.'); render();
        });
        return;
      }
    }
    p[s.dataset.pref] = (v === 'true' ? true : v === 'false' ? false : v);
    H.savePrefs(p); SS.renderNav({ active: tab }); SS.toast('Saved.'); render();
  });
  route();
}
</script>
<script>
document.addEventListener('change', function (e) {
  if (e.target.id !== 'pfPhoto' || !e.target.files[0]) return;
  var fr = new FileReader();
  fr.onload = function (ev) { var img = new Image(); img.onload = function () {
    var n = 160, c = document.createElement('canvas'); c.width = c.height = n;
    var k = Math.max(n / img.width, n / img.height), sw = n / k, sh = n / k;
    c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, n, n);
    var u = SS.me(); SS.updateUser(u.role, u.email, function (x) { x.avatarType = 'photo'; x.avatarValue = c.toDataURL('image/jpeg', 0.8); });
    location.reload();
  }; img.src = ev.target.result; };
  fr.readAsDataURL(e.target.files[0]);
});
</script>
</body>
</html>
