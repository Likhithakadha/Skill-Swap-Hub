<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<div id="nav"></div>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <span id="headAvatar"></span>
      <div class="grow">
        <h1 id="hello"></h1>
        <p id="helloSub"></p>
      </div>
      <div class="head-actions">
        <a class="btn btn-learner" href="mentor.html">Find a mentor</a>
        <a class="btn btn-ghost" href="skills.html">Browse skills</a>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="section-head"><h2>Upcoming sessions</h2><a href="track.html">All requests</a></div>
    <div id="sessions"></div>

    <div class="section-head"><h2>Mentors for what you want to learn</h2><a href="mentor.html">See all mentors</a></div>
    <div class="people" id="suggest"></div>

    <div class="section-head"><h2>Your network</h2><a href="network.html">Open network</a></div>
    <div id="netSummary"></div>
  </div>
</main>

<script src="sync.js"></script>
<script src="ss.js"></script>
<script src="hub.js"></script>
<script>
  var user = SS.guard('learner');
  if (user) {
    SS.renderNav({ active: 'home' });

    function render() {
      user = SS.me();
      var mine = SS.requestsOfLearner(user.email);
      var accepted = mine.filter(function (r) { return r.status === 'accepted'; });
      var pending = mine.filter(function (r) { return r.status === 'pending'; });
      var connected = SS.myConns(user.key);
      var incoming = SS.incomingConns(user.key);

      document.getElementById('headAvatar').innerHTML = SS.avatar(user, 'xl');
      document.getElementById('hello').textContent = 'Hi, ' + user.name.split(' ')[0];
      document.getElementById('helloSub').textContent = (user.interests || []).length
        ? 'You are learning: ' + user.interests.join(', ') + '.'
        : 'Pick a skill to get started.';

      document.getElementById('stats').innerHTML =
        '<div class="stat is-learner"><div class="num">' + pending.length + '</div><div class="label">Requests waiting</div></div>' +
        '<div class="stat is-learner"><div class="num">' + accepted.length + '</div><div class="label">Sessions confirmed</div></div>' +
        '<div class="stat is-learner"><div class="num">' + connected.length + '</div><div class="label">Connections</div></div>' +
        '<div class="stat is-learner"><div class="num">' + incoming.length + '</div><div class="label">Connection requests for you</div></div>';

      // Sessions
      var box = document.getElementById('sessions');
      box.innerHTML = accepted.length ? accepted.map(function (r) {
        return '<div class="row-card"><div class="info">' +
          '<div class="row-top"><span class="skill-tag">' + SS.skillIcon(r.skill) + SS.esc(r.skill) + '</span><span class="status status-accepted">Confirmed</span></div>' +
          '<h3>With ' + SS.esc(r.mentorName || 'your mentor') + '</h3>' +
          '<div class="link-line">Meeting link: <a href="' + SS.esc(r.meetLink) + '" target="_blank" rel="noopener">' + SS.esc(r.meetLink) + '</a></div>' +
          '</div><div class="actions"><a class="btn btn-learner btn-sm" href="' + SS.esc(r.meetLink) + '" target="_blank" rel="noopener">Join meeting</a></div></div>';
      }).join('') : '<div class="empty"><h3>No sessions yet</h3><p>Send a request to a mentor. Once they accept, the meeting link shows up here.</p><a class="btn btn-learner" href="mentor.html">Find a mentor</a></div>';

      // Suggested mentors: skills of interest first
      var interests = user.interests || [];
      var all = SS.teachers().map(function (t) { t.role = 'mentor'; t.key = SS.keyOf('mentor', t.email); return t; });
      var list = all.filter(function (t) { return interests.indexOf(t.skill) > -1; });
      if (!list.length) list = all;
      list = list.slice(0, 3);
      document.getElementById('suggest').innerHTML = list.length ? list.map(function (t) {
        var st = SS.connState(user.key, t.key).state;
        var connectBtn = st === 'connected' ? '<a class="btn btn-ghost btn-sm" href="network.html">Connected</a>'
          : st === 'sent' ? '<button class="btn btn-ghost btn-sm" disabled>Requested</button>'
          : '<button class="btn btn-ghost btn-sm" data-connect="' + SS.esc(t.key) + '">Connect</button>';
        return SS.personCard(t,
          '<button class="btn btn-learner btn-sm" data-req="' + SS.esc(t.email) + '">Request session</button>' + connectBtn);
      }).join('') : '<div class="empty" style="grid-column:1/-1"><h3>No mentors yet</h3><p>Mentors will appear here as soon as they sign up.</p></div>';

      // Network summary
      document.getElementById('netSummary').innerHTML = (connected.length || incoming.length)
        ? '<div class="row-card"><div class="info"><h3>' + connected.length + ' connection' + (connected.length === 1 ? '' : 's') + '</h3>' +
          '<p>' + (incoming.length ? incoming.length + ' new request' + (incoming.length === 1 ? '' : 's') + ' waiting for your reply.' : 'Message the people you have connected with.') + '</p></div>' +
          '<div class="actions"><a class="btn btn-primary btn-sm" href="network.html">Open network</a></div></div>'
        : '<div class="empty"><h3>Nobody yet</h3><p>Connect with mentors and fellow learners to ask questions and study together.</p><a class="btn btn-primary" href="network.html">Discover people</a></div>';
    }

    document.addEventListener('click', function (e) {
      var r = e.target.closest('[data-req]');
      if (r) {
        var m = SS.findUser('mentor', r.dataset.req);
        SS.openRequestModal({ skill: m.skill, mentor: m, onDone: render });
      }
      var c = e.target.closest('[data-connect]');
      if (c) { if (SS.sendConnect(user.key, c.dataset.connect)) SS.toast('Connection request sent.'); render(); }
    });

    SS.startTick(render);
    render();
  }
</script>
</body>
</html>
